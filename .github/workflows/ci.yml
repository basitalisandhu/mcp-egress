name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          mcp-egress --version
          mcp-egress run --out /tmp/egress.json -- python tests/fixtures/proxied_server.py
          python -c "import json; d=json.load(open('/tmp/egress.json')); assert d['server']['name']=='proxied-fixture'"
