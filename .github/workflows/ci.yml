name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          mcp-egress --version
          mcp-egress run --out /tmp/egress.json -- python tests/fixtures/proxied_server.py
          python -c "import json; d=json.load(open('/tmp/egress.json')); assert d['server']['name']=='proxied-fixture'"

  quickstart:
    name: README quick start on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install into a new venv and run the quick start
        run: scripts/e2e_quickstart.sh

  action:
    name: Run the composite action on the fixture server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the fixture server's dependency and start a local web server
        run: |
          python -m pip install mcp
          python -m http.server 39211 --bind 127.0.0.1 --directory "$RUNNER_TEMP" &
          echo '[{"tool": "fetch", "arguments": {"url": "http://127.0.0.1:39211/"}}]' > "$RUNNER_TEMP/calls.json"
          sleep 1
      - id: egress
        uses: ./action
        with:
          command: python tests/fixtures/proxied_server.py
          calls: ${{ runner.temp }}/calls.json
          baseline: ${{ runner.temp }}/egress.baseline.json
          check: false
          out: ${{ runner.temp }}/egress.json
      - name: Show outputs
        env:
          OUT: ${{ steps.egress.outputs.out }}
          NEW_HOSTS: ${{ steps.egress.outputs.new-hosts }}
        run: |
          echo "out=$OUT new-hosts=$NEW_HOSTS"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['server']['name']=='proxied-fixture'; assert [h['port'] for h in d['hosts']]==[39211], d['hosts']" "$OUT"

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help and record the fixture server from a mount
        run: |
          docker build --build-arg VERSION=ci -t mcp-egress:ci .
          docker run --rm mcp-egress:ci --help > help.txt && grep "^usage: mcp-egress" help.txt
          docker run --rm mcp-egress:ci --version
          test "$(docker run --rm --entrypoint id mcp-egress:ci -u)" = "1000"
          # The container runs as uid 1000, so give it a writable work directory.
          W="$RUNNER_TEMP/egress"
          mkdir -p "$W" && chmod 777 "$W"
          cp tests/fixtures/proxied_server.py "$W/"
          echo '[{"tool":"echo","arguments":{"text":"no network"}}]' > "$W/quiet.json"
          echo '[{"tool":"fetch","arguments":{"url":"http://127.0.0.1:9/"}}]' > "$W/new.json"
          docker run --rm -v "$W:/work" mcp-egress:ci run --calls quiet.json --baseline baseline.json --out egress.json -- python proxied_server.py
          docker run --rm -v "$W:/work" mcp-egress:ci run --calls quiet.json --baseline baseline.json --check --out egress.json -- python proxied_server.py
          python3 -c "import json; d=json.load(open('$W/egress.json')); assert d['server']['name']=='proxied-fixture'"
          set +e
          docker run --rm -v "$W:/work" mcp-egress:ci run --calls new.json --baseline baseline.json --check --out egress.json -- python proxied_server.py
          test $? -eq 1
