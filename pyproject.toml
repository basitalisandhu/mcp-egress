[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-egress"
version = "0.1.0"
description = "Record every host an MCP server contacts, per tool, through an embedded CONNECT proxy, and fail CI when a new one appears."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Basit Ali" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "egress",
  "network-security",
  "supply-chain-security",
  "agent-security",
  "ai-agents",
  "llm-agents",
  "claude-code",
  "proxy",
  "allowlist",
  "security-tools",
  "devsecops",
  "ci",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "jsonschema>=4.0",
]

[project.scripts]
mcp-egress = "mcp_egress.cli:main"

[project.urls]
Homepage = "https://github.com/basitalisandhu/mcp-egress"
Repository = "https://github.com/basitalisandhu/mcp-egress"
Issues = "https://github.com/basitalisandhu/mcp-egress/issues"
Changelog = "https://github.com/basitalisandhu/mcp-egress/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_egress"]

[tool.hatch.build.targets.sdist]
include = [
  "src/mcp_egress/**",
  "schema/**",
  "examples/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.5",
  "jsonschema>=4.0",
  "build>=1.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
